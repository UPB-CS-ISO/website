<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="566" viewBox="0 0 1200 566"><defs><marker id="ab85450" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b85450"/></marker><marker id="a000" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker><marker id="a3a7d2c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a7d2c"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="600.0" y="28" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="22" fill="#555555" font-style="italic" text-anchor="middle" dominant-baseline="central">the redirect trap: your shell opens the file before sudo starts</text><g transform="translate(0,56)"><text x="30" y="30" font-family="DejaVu Sans Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="24" fill="#000" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan fill="#3a7d2c" font-weight="bold">$ </tspan><tspan fill="#000">sudo echo hello &gt;&gt; /etc/hosts</tspan></text><rect x="30" y="70" width="260" height="100" rx="14" fill="#bac8d3" stroke="#23445d" stroke-width="2"/><text x="160.0" y="105.0" font-family="DejaVu Sans Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="26" fill="#000" text-anchor="middle" dominant-baseline="central" xml:space="preserve" font-weight="bold">bash</text><text x="160.0" y="138.0" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="20" fill="#000" text-anchor="middle" dominant-baseline="central" xml:space="preserve"><tspan fill="#000">👤 </tspan><tspan fill="#23445d" font-weight="bold">student</tspan><tspan fill="#333">  UID 1000</tspan></text><rect x="440" y="70" width="280" height="100" rx="14" fill="#ffffff" stroke="#666666" stroke-width="2"/><text x="580.0" y="106.35" font-family="DejaVu Sans Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="21" fill="#000000" text-anchor="middle" dominant-baseline="central" xml:space="preserve">/etc/hosts</text><text x="580.0" y="133.65" font-family="DejaVu Sans Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="21" fill="#000000" text-anchor="middle" dominant-baseline="central" xml:space="preserve">root root rw-r--r--</text><path d="M290,120 L435,120" fill="none" stroke="#b85450" stroke-width="2.5" marker-end="url(#ab85450)"/><text x="362" y="98.0" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="18" fill="#b85450" text-anchor="middle" dominant-baseline="central" xml:space="preserve">opens it for &gt;&gt;</text><path d="M348,121 L376,149 M376,121 L348,149" stroke="#b85450" stroke-width="5" stroke-linecap="round"/><rect x="800" y="70" width="360" height="100" rx="14" fill="#f5f5f5" stroke="#999999" stroke-width="2" stroke-dasharray="10 6"/><text x="980.0" y="106.35" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="21" fill="#999999" text-anchor="middle" dominant-baseline="central" xml:space="preserve">sudo echo hello</text><text x="980.0" y="133.65" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="21" fill="#999999" text-anchor="middle" dominant-baseline="central" xml:space="preserve">never starts</text><text x="580" y="200" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="21" fill="#b85450" text-anchor="middle" dominant-baseline="central" xml:space="preserve" font-weight="bold">❌ bash: /etc/hosts: Permission denied</text><line x1="20" y1="245" x2="1180" y2="245" stroke="#ccc" stroke-width="2" stroke-dasharray="6 6"/><text x="30" y="285" font-family="DejaVu Sans Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="24" fill="#000" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan fill="#3a7d2c" font-weight="bold">$ </tspan><tspan fill="#000">echo hello | sudo tee -a /etc/hosts</tspan></text><rect x="30" y="330" width="240" height="100" rx="14" fill="#bac8d3" stroke="#23445d" stroke-width="2"/><text x="150.0" y="365.0" font-family="DejaVu Sans Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="26" fill="#000" text-anchor="middle" dominant-baseline="central" xml:space="preserve" font-weight="bold">echo hello</text><text x="150.0" y="398.0" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="20" fill="#000" text-anchor="middle" dominant-baseline="central" xml:space="preserve"><tspan fill="#000">👤 </tspan><tspan fill="#23445d" font-weight="bold">student</tspan><tspan fill="#333">  UID 1000</tspan></text><rect x="420" y="330" width="240" height="100" rx="14" fill="#f8cecc" stroke="#b85450" stroke-width="2"/><text x="540.0" y="358.0" font-family="DejaVu Sans Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="26" fill="#000" text-anchor="middle" dominant-baseline="central" xml:space="preserve" font-weight="bold">tee -a</text><text x="540.0" y="390.0" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="20" fill="#000" text-anchor="middle" dominant-baseline="central" xml:space="preserve"><tspan fill="#000">👤 </tspan><tspan fill="#b85450" font-weight="bold">root</tspan><tspan fill="#333">  UID 0</tspan></text><text x="540.0" y="418.0" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="17" fill="#444" text-anchor="middle" dominant-baseline="central" xml:space="preserve" font-style="italic">started by sudo</text><rect x="830" y="330" width="300" height="100" rx="14" fill="#ffffff" stroke="#666666" stroke-width="2"/><text x="980.0" y="366.35" font-family="DejaVu Sans Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="21" fill="#000000" text-anchor="middle" dominant-baseline="central" xml:space="preserve">/etc/hosts</text><text x="980.0" y="393.65" font-family="DejaVu Sans Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="21" fill="#000000" text-anchor="middle" dominant-baseline="central" xml:space="preserve">root root rw-r--r--</text><path d="M270,380 L415,380" fill="none" stroke="#000" stroke-width="2.5" marker-end="url(#a000)"/><text x="342" y="358.0" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="18" fill="#000" text-anchor="middle" dominant-baseline="central" xml:space="preserve">the text, | pipe</text><path d="M660,380 L825,380" fill="none" stroke="#3a7d2c" stroke-width="2.5" marker-end="url(#a3a7d2c)"/><text x="742" y="358.0" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="18" fill="#3a7d2c" text-anchor="middle" dominant-baseline="central" xml:space="preserve">appends, as root</text><path d="M540,430 L540,480" fill="none" stroke="#000" stroke-width="2.5" marker-end="url(#a000)"/><text x="560" y="458.0" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="18" fill="#000" text-anchor="start" dominant-baseline="central" xml:space="preserve">a copy, on the screen</text><text x="980" y="470" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="21" fill="#3a7d2c" text-anchor="middle" dominant-baseline="central" xml:space="preserve" font-weight="bold">✅ the line is added</text></g></svg>
