<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="696" viewBox="0 0 1200 696"><defs><marker id="ad79b00" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d79b00"/></marker><marker id="a999999" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#999999"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="600.0" y="28" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="22" fill="#555555" font-style="italic" text-anchor="middle" dominant-baseline="central">which permissions apply: the kernel asks in this order, and the first yes decides</text><g transform="translate(0,56)"><rect x="330" y="20" width="340" height="100" rx="14" fill="#bac8d3" stroke="#23445d" stroke-width="2"/><text x="500.0" y="48.0" font-family="DejaVu Sans Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="26" fill="#000" text-anchor="middle" dominant-baseline="central" xml:space="preserve" font-weight="bold">cat notes.txt</text><text x="500.0" y="80.0" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="20" fill="#000" text-anchor="middle" dominant-baseline="central" xml:space="preserve"><tspan fill="#000">👤 </tspan><tspan fill="#23445d" font-weight="bold">bob</tspan><tspan fill="#333">  UID 1001</tspan></text><text x="500.0" y="108.0" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="17" fill="#444" text-anchor="middle" dominant-baseline="central" xml:space="preserve" font-style="italic">groups: bob, students</text><rect x="20" y="220" width="260" height="120" rx="14" fill="#ffffff" stroke="#666666" stroke-width="2"/><text x="150" y="250" font-family="DejaVu Sans Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="24" fill="#000" text-anchor="middle" dominant-baseline="central" xml:space="preserve" font-weight="bold">notes.txt</text><text x="150" y="285" font-family="DejaVu Sans Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="26" fill="#000" text-anchor="middle" dominant-baseline="central" xml:space="preserve"><tspan fill="#6c8ebf" font-weight="bold">rw-</tspan><tspan fill="#82b366" font-weight="bold"> r--</tspan><tspan fill="#d79b00" font-weight="bold"> ---</tspan></text><text x="150" y="318" font-family="DejaVu Sans Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="20" fill="#000" text-anchor="middle" dominant-baseline="central" xml:space="preserve"><tspan fill="#6c8ebf" font-weight="bold">student</tspan><tspan fill="#000"> : </tspan><tspan fill="#82b366" font-weight="bold">students</tspan></text><path d="M500,120 L500,155" fill="none" stroke="#d79b00" stroke-width="2.5" marker-end="url(#ad79b00)"/><rect x="340" y="160" width="320" height="90" rx="14" fill="#ffe6cc" stroke="#d79b00" stroke-width="2"/><text x="500.0" y="192.0" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="20" fill="#000000" text-anchor="middle" dominant-baseline="central" xml:space="preserve">is the UID 0 (root)?</text><text x="500.0" y="218.0" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="20" fill="#000000" text-anchor="middle" dominant-baseline="central" xml:space="preserve">1001 = 0 ?</text><rect x="800" y="170" width="330" height="70" rx="14" fill="#f5f5f5" stroke="#999999" stroke-width="2"/><text x="965.0" y="205.0" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="22" fill="#999999" text-anchor="middle" dominant-baseline="central" xml:space="preserve">👑 everything is allowed</text><path d="M660,205 L795,205" fill="none" stroke="#999999" stroke-width="2" marker-end="url(#a999999)"/><text x="728" y="188.0" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="18" fill="#999999" text-anchor="middle" dominant-baseline="central" xml:space="preserve">yes</text><path d="M500,250 L500,285" fill="none" stroke="#d79b00" stroke-width="4" marker-end="url(#ad79b00)"/><text x="525" y="268.0" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="18" fill="#d79b00" text-anchor="start" dominant-baseline="central" xml:space="preserve">no</text><rect x="340" y="290" width="320" height="90" rx="14" fill="#ffe6cc" stroke="#d79b00" stroke-width="2"/><text x="500.0" y="322.0" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="20" fill="#000000" text-anchor="middle" dominant-baseline="central" xml:space="preserve">is the UID the owner?</text><text x="500.0" y="348.0" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="20" fill="#000000" text-anchor="middle" dominant-baseline="central" xml:space="preserve">1001 = student (1000) ?</text><rect x="800" y="300" width="330" height="70" rx="14" fill="#f5f5f5" stroke="#999999" stroke-width="2"/><text x="965.0" y="335.0" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="22" fill="#999999" text-anchor="middle" dominant-baseline="central" xml:space="preserve">use u:  rw-</text><path d="M660,335 L795,335" fill="none" stroke="#999999" stroke-width="2" marker-end="url(#a999999)"/><text x="728" y="318.0" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="18" fill="#999999" text-anchor="middle" dominant-baseline="central" xml:space="preserve">yes</text><path d="M500,380 L500,415" fill="none" stroke="#d79b00" stroke-width="4" marker-end="url(#ad79b00)"/><text x="525" y="398.0" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="18" fill="#d79b00" text-anchor="start" dominant-baseline="central" xml:space="preserve">no</text><rect x="340" y="420" width="320" height="90" rx="14" fill="#ffe6cc" stroke="#d79b00" stroke-width="2"/><text x="500.0" y="452.0" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="20" fill="#000000" text-anchor="middle" dominant-baseline="central" xml:space="preserve">is the group of the file</