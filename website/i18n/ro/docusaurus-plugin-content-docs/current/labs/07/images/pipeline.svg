<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330"><defs><marker id="a6c8ebf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6c8ebf"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="600" y="30" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="22" fill="#444" text-anchor="middle" dominant-baseline="central" xml:space="preserve" font-style="italic">gcc hello.c -o hello runs four steps: each one reads a file and writes the next one</text><rect x="38.0" y="90" width="148" height="74" rx="10" fill="#ffffff" stroke="#666666" stroke-width="2"/><text x="112.0" y="116" font-family="DejaVu Sans Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="19" fill="#000" text-anchor="middle" dominant-baseline="central" xml:space="preserve" font-weight="bold">hello.c</text><text x="112.0" y="142" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="15" fill="#555" text-anchor="middle" dominant-baseline="central" xml:space="preserve" font-style="italic">C source</text><text x="112.0" y="232" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="14" fill="#555" text-anchor="middle" dominant-baseline="central" xml:space="preserve" font-style="italic">#include, #define</text><text x="112.0" y="254" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="14" fill="#555" text-anchor="middle" dominant-baseline="central" xml:space="preserve" font-style="italic">comments</text><line x1="192.0" y1="127" x2="276.0" y2="127" stroke="#6c8ebf" stroke-width="2" marker-end="url(#a6c8ebf)"/><text x="234.0" y="105" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="14" fill="#6c8ebf" text-anchor="middle" dominant-baseline="central" xml:space="preserve" font-weight="bold">preprocessor</text><text x="234.0" y="150" font-family="DejaVu Sans Mono, Menlo, Cons