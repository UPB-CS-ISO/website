s Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="15" fill="#d79b00" text-anchor="middle" dominant-baseline="central" xml:space="preserve">gcc</text><text x="1088.0" y="232" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="14" fill="#555" text-anchor="middle" dominant-baseline="central" xml:space="preserve" font-style="italic">runs with</text><text x="1088.0" y="254" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="14" fill="#555" text-anchor="middle" dominant-baseline="central" xml:space="preserve" font-style="italic">libc.so.6</text><text x="600" y="300" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="15" fill="#777" text-anchor="middle" dominant-baseline="central" xml:space="preserve" font-style="italic">the option under a file stops gcc right after it writes that file</text></svg>
