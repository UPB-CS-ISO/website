<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540"><defs><marker id="a666666" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666666"/></marker><marker id="a6c8ebf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6c8ebf"/></marker><marker id="ad79b00" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d79b00"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="600" y="30" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="22" fill="#444" text-anchor="middle" dominant-baseline="central" xml:space="preserve" font-style="italic">the editor starts clangd as its child, and they talk through two pipes, in JSON messages</text><rect x="90" y="60" width="340" height="90" rx="10" fill="#ffffff" stroke="#666666" stroke-width="2"/><text x="260" y="88" font-family="DejaVu Sans Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="21" fill="#000" text-anchor="middle" dominant-baseline="central" xml:space="preserve" font-weight="bold">hx main.c</text><text x="260" y="120" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="15" fill="#555" text-anchor="middle" dominant-baseline="central" xml:space="preserve" font-style="italic">the editor: the parent</text><rect x="770" y="60" width="340" height="90" rx="10" fill="#ffe6cc" stroke="#d79b00" stroke-width="2"/><text x="940" y="88" font-family="DejaVu Sans Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="21" fill="#d79b00" text-anchor="middle" dominant-baseline="central" xml:space="preserve" font-weight="bold">clangd</text><text x="940" y="120" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="15" fill="#555" text-anchor="middle" dominant-baseline="central" xml:space="preserve" font-style="italic">the language server: the child</text><line x1="435" y1="80" x2="765" y2="80" stroke="#666666" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#a666666)"/><text x="600" y="66" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="14" fill="#555" text-anchor="middle" dominant-baseline="central" xml:space="preserve" font-style="italic">starts it, when you open a .c file</text><line x1="435" y1="112" x2="765" y2="112" stroke="#6c8ebf" stroke-width="3" marker-end="url(#a6c8ebf)"/><text x="600" y="100" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="14" fill="#6c8ebf" text-anchor="middle" dominant-baseline="central" xml:space="preserve">pipe: into the input (0) of clangd</text><line x1="765" y1="138" x2="435" y2="138" stroke="#d79b00" stroke-width="3" marker-end="url(#ad79b00)"/><text x="600" y="152" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="14" fill="#d79b00" text-anchor="middle" dominant-baseline="central" xml:space="preserve">pipe: from the output (1) of clangd</text><line x1="260" y1="152" x2="260" y2="510" stroke="#bbb" stroke-width="2" stroke-dasharray="6 6"/><line x1="940" y1="152" x2="940" y2="510" stroke="#bbb" stroke-width="2" stroke-dasharray="6 6"/><line x1="264" y1="215" x2="936" y2="215" stroke="#6c8ebf" stroke-width="2" marker-end="url(#a6c8ebf)"/><text x="600" y="199" font-family="DejaVu Sans Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="16" fill="#6c8ebf" text-anchor="middle" dominant-baseline="central" xml:space="preserve" font-weight="bold">textDocument/didOpen</text><text x="600" y="233" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="14" fill="#555" text-anchor="middle" dominant-baseline="central" xml:space="preserve" font-style="italic">the whole text of main.c, again after every change</text><text x="248" y="215" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="14" fill="#777" text-anchor="end" dominant-baseline="central" xml:space="preserve" font-style="italic">you open main.c</text><line x1="936" y1="293" x2="264" y2="293" stroke="#d79b00" stroke-width="2" marker-end="url(#ad79b00)"/><text x="600" y="277" font-family="DejaVu Sans Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="16" fill="#d79b00" text-anchor="middle" dominant-baseline="central" xml:space="preserve" font-weight="bold">textDocument/publishDiagnostics</text><text x="600" y="311" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="14" fill="#555" text-anchor="middle" dominant-baseline="central" xml:space="preserve" font-style="italic">line 7: Use of undeclared identifier &#x27;totl&#x27;</text><text x="248" y="293" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="14" fill="#777" text-anchor="end" dominant-baseline="central" xml:space="preserve" font-style="italic">totl is underlined</text><line x1="264" y1="371" x2="936" y2="371" stroke="#6c8ebf" stroke-width="2" marker-end="url(#a6c8ebf)"/><text x="600" y="355" font-family="DejaVu Sans Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="16" fill="#6c8ebf" text-anchor="middle" dominant-baseline="central" xml:space="preserve" font-weight="bold">textDocument/hover</text><text x="600" y="389" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="14" fill="#555" text-anchor="middle" dominant-baseline="central" xml:space="preserve" font-style="italic">line 6, character 16: what is this name?</text><text x="248" y="371" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="14" fill="#777" text-anchor="end" dominant-baseline="central" xml:space="preserve" font-style="italic">Space k on sum</text><line x1="936" y1="449" x2="264" y2="449" stroke="#d79b00" stroke-width="2" marker-end="url(#ad79b00)"/><text x="600" y="433" font-family="DejaVu Sans Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="16" fill="#d79b00" text-anchor="middle" dominant-baseline="central" xml:space="preserve" font-weight="bold">the answer</text><text x="600" y="467" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="14" fill="#555" text-anchor="middle" dominant-baseline="central" xml:space="preserve" font-style="italic">int sum(int n), provided by &quot;lib.h&quot;</text><text x="248" y="449" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="14" fill="#777" text-anchor="end" dominant-baseline="central" xml:space="preserve" font-style="italic">a popup shows it</text><text x="952" y="449" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="1" fill="#000" text-anchor="middle" dominant-baseline="central" xml:space="preserve"></text><text x="600" y="525" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="14" fill="#777" text-anchor="middle" dominant-baseline="central" xml:space="preserve" font-style="italic">blue: the editor asks or tells; orange: clangd answers, or sends the errors by itself</text></svg>
