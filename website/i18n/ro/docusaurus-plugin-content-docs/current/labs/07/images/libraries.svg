<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520"><defs><marker id="a666666" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666666"/></marker><marker id="ad79b00" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d79b00"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="600" y="30" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="22" fill="#444" text-anchor="middle" dominant-baseline="central" xml:space="preserve" font-style="italic">a static library is copied into the program; a shared library is loaded when the program starts</text><line x1="600" y1="60" x2="600" y2="500" stroke="#ccc" stroke-width="2" stroke-dasharray="6 6"/><text x="300" y="75" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="21" fill="#333" text-anchor="middle" dominant-baseline="central" xml:space="preserve" font-weight="bold">static library</text><rect x="25.0" y="110" width="170" height="74" rx="10" fill="#ffffff" stroke="#666666" stroke-width="2"/><text x="110" y="136" font-family="DejaVu Sans Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="19" fill="#000" text-anchor="middle" dominant-baseline="central" xml:space="preserve" font-weight="bold">lib.o</text><text x="110" y="162" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="15" fill="#555" text-anchor="middle" dominant-baseline="central" xml:space="preserve" font-style="italic">sum</text><line x1="197" y1="147" x2="363" y2="147" stroke="#666666" stroke-width="2" marker-end="url(#a666666)"/><text x="280" y="128" font-family="DejaVu Sans Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="13" fill="#6c8ebf" text-anchor="middle" dominant-baseline="central" xml:space="preserve">ar rcs libsum.a</text><rect x="370.0" y="110" width="180" height="74" rx="10" fill="#ffffff" stroke="#666666" stroke-width="2"/><text x="460" y="136" font-family="DejaVu Sans Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="19" fill="#000" text-anchor="middle" dominant-baseline="central" xml:space="preserve" font-weight="bold">libsum.a</text><text x="460" y="162" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="15" fill="#555" text-anchor="middle" dominant-baseline="central" xml:space="preserve" font-style="italic">archive of lib.o</text><rect x="25.0" y="290" width="170" height="74" rx="10" fill="#ffffff" stroke="#666666" stroke-width="2"/><text x="110" y="316" font-family="DejaVu Sans Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="19" fill="#000" text-anchor="middle" dominant-baseline="central" xml:space="preserve" font-weight="bold">main.o</text><text x="110" y="342" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="15" fill="#555" text-anchor="middle" dominant-baseline="central" xml:space="preserve" font-style="italic">U sum</text><line x1="197" y1="327" x2="363" y2="327" stroke="#666666" stroke-width="2" marker-end="url(#a666666)"/><text x="280" y="306" font-family="DejaVu Sans Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="13" fill="#6c8ebf" text-anchor="middle" dominant-baseline="central" xml:space="preserve">gcc -L. -lsum</text><rect x="370.0" y="290" width="180" height="74" rx="10" fill="#ffe6cc" stroke="#d79b00" stroke-width="2"/><text x="460" y="316" font-family="DejaVu Sans Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="19" fill="#d79b00" text-anchor="middle" dominant-baseline="central" xml:space="preserve" font-weight="bold">app</text><text x="460" y="342" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="15" fill="#555" text-anchor="middle" dominant-baseline="central" xml:space="preserve" font-style="italic">main + sum, copied in</text><line x1="460" y1="186" x2="460" y2="286" stroke="#d79b00" stroke-width="3" marker-end="url(#ad79b00)"/><text x="448" y="236" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="14" fill="#d79b00" text-anchor="end" dominant-baseline="central" xml:space="preserve" font-style="italic">copied in, when linking</text><text x="300" y="420" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="15" fill="#555" text-anchor="middle" dominant-baseline="central" xml:space="preserve" font-style="italic">app runs without libsum.a;</text><text x="300" y="444" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="15" fill="#555" text-anchor="middle" dominant-baseline="central" xml:space="preserve" font-style="italic">a new libsum.a needs a new link of app</text><text x="900" y="75" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="21" fill="#333" text-anchor="middle" dominant-baseline="central" xml:space="preserve" font-weight="bold">shared library</text><rect x="625.0" y="110" width="170" height="74" rx="10" fill="#ffffff" stroke="#666666" stroke-width="2"/><text x="710" y="136" font-family="DejaVu Sans Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="19" fill="#000" text-anchor="middle" dominant-baseline="central" xml:space="preserve" font-weight="bold">lib.o</text><text x="710" y="162" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="15" fill="#555" text-anchor="middle" dominant-baseline="central" xml:space="preserve" font-style="italic">sum</text><line x1="797" y1="147" x2="963" y2="147" stroke="#666666" stroke-width="2" marker-end="url(#a666666)"/><text x="880" y="128" font-family="DejaVu Sans Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="13" fill="#6c8ebf" text-anchor="middle" dominant-baseline="central" xml:space="preserve">gcc -shared</text><rect x="970.0" y="110" width="180" height="74" rx="10" fill="#ffffff" stroke="#666666" stroke-width="2"/><text x="1060" y="136" font-family="DejaVu Sans Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="19" fill="#000" text-anchor="middle" dominant-baseline="central" xml:space="preserve" font-weight="bold">libsum.so</text><text x="1060" y="162" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="15" fill="#555" text-anchor="middle" dominant-baseline="central" xml:space="preserve" font-style="italic">sum, -fPIC</text><rect x="625.0" y="290" width="170" height="74" rx="10" fill="#ffffff" stroke="#666666" stroke-width="2"/><text x="710" y="316" font-family="DejaVu Sans Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="19" fill="#000" text-anchor="middle" dominant-baseline="central" xml:space="preserve" font-weight="bold">main.o</text><text x="710" y="342" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="15" fill="#555" text-anchor="middle" dominant-baseline="central" xml:space="preserve" font-style="italic">U sum</text><line x1="797" y1="327" x2="963" y2="327" stroke="#666666" stroke-width="2" marker-end="url(#a666666)"/><text x="880" y="306" font-family="DejaVu Sans Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="13" fill="#6c8ebf" text-anchor="middle" dominant-baseline="central" xml:space="preserve">gcc -L. -lsum</text><rect x="970.0" y="290" width="180" height="74" rx="10" fill="#ffe6cc" stroke="#d79b00" stroke-width="2"/><text x="1060" y="316" font-family="DejaVu Sans Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="19" fill="#d79b00" text-anchor="middle" dominant-baseline="central" xml:space="preserve" font-weight="bold">app</text><text x="1060" y="342" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="15" fill="#555" text-anchor="middle" dominant-baseline="central" xml:space="preserve" font-style="italic">main, needs libsum.so</text><line x1="1060" y1="186" x2="1060" y2="286" stroke="#666666" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#a666666)"/><text x="1048" y="236" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="14" fill="#555" text-anchor="end" dominant-baseline="central" xml:space="preserve" font-style="italic">loaded when app starts</text><text x="900" y="420" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="15" fill="#555" text-anchor="middle" dominant-baseline="central" xml:space="preserve" font-style="italic">the loader must find libsum.so at every start;</text><text x="900" y="444" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="15" fill="#555" text-anchor="middle" dominant-baseline="central" xml:space="preserve" font-style="italic">a new libsum.so changes app without a new link</text></svg>
