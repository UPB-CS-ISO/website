<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600"><defs><marker id="a82b366" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#82b366"/></marker><marker id="a9673a6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9673a6"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="600.0" y="30" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="22" fill="#444" text-anchor="middle" dominant-baseline="central" xml:space="preserve" font-style="italic">an awk program: for every line, the action of every true condition runs; END runs once, at the end</text><text x="152.11199999999997" y="85" font-family="DejaVu Sans Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="24" fill="#000" text-anchor="start" dominant-baseline="central" xml:space="preserve">awk </text><text x="209.90399999999997" y="85" font-family="DejaVu Sans Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="24" fill="#6c8ebf" text-anchor="start" dominant-baseline="central" xml:space="preserve" font-weight="bold">-F, </text><text x="267.69599999999997" y="85" font-family="DejaVu Sans Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="24" fill="#000" text-anchor="start" dominant-baseline="central" xml:space="preserve">'</text><text x="282.14399999999995" y="85" font-family="DejaVu Sans Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="24" fill="#82b366" text-anchor="start" dominant-baseline="central" xml:space="preserve" font-weight="bold">$2 == "apple" </text><text x="484.41599999999994" y="85" font-family="DejaVu Sans Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="24" fill="#d79b00" text-anchor="start" dominant-baseline="central" xml:space="preserve" font-weight="bold">{ s += $3 } </text><text x="657.7919999