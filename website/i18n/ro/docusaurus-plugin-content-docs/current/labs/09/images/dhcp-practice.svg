<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666666"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="600.0" y="30" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="22" fill="#444" text-anchor="middle" dominant-baseline="central" xml:space="preserve" font-style="italic">exercise 11: you play the DHCP client; the practice server is ready-made</text><rect x="40" y="70" width="300" height="330" rx="10" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/><text x="190" y="95" font-family="DejaVu Sans Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="17" fill="#000" text-anchor="middle" dominant-baseline="central" xml:space="preserve" font-weight="bold">client</text><text x="190" y="120" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="14" fill="#000" text-anchor="middle" dominant-baseline="central" xml:space="preserve">you: the DHCP client</text><rect x="60" y="140" width="260" height="36" rx="6" fill="#ffffff" stroke="#666666" stroke-width="1.5"/><text x="190" y="158" font-family="DejaVu Sans Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="14" fill="#000" text-anchor="middle" dominant-baseline="central" xml:space="preserve" font-weight="bold">dhclient -v eth0</text><text x="190" y="200" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="14" fill="#000" text-anchor="middle" dominant-baseline="central" xml:space="preserve" font-weight="bold">the addresses of eth0:</text><rect x="60" y="222" width="260" height="50" rx="6" fill="#ffffff" stroke="#666666" stroke-width="1.5"/><text x="190" y="236" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="12.5" fill="#555" text-anchor="middle" dominant-baseline="central" xml:space="preserve">at the start</text><text x="190" y="253" font-family="DejaVu Sans Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="13" fill="#000" text-anchor="middle" dominant-baseline="central" xml:space="preserve" font-weight="bold">10.88.0.12</text><text x="190" y="267" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="11.5" fill="#777" text-anchor="middle" dominant-baseline="central" xml:space="preserve">from podman</text><rect x="60" y="280" width="260" height="50" rx="6" fill="#ffffff" stroke="#666666" stroke-width="1.5"/><text x="190" y="294" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="12.5" fill="#555" text-anchor="middle" dominant-baseline="central" xml:space="preserve">after ACK</text><text x="190" y="311" font-family="DejaVu Sans Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="13" fill="#000" text-anchor="middle" dominant-baseline="central" xml:space="preserve" font-weight="bold">10.88.0.12 + 10.88.0.204</text><text x="190" y="325" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="11.5" fill="#777" text-anchor="middle" dominant-baseline="central" xml:space="preserve">the second one from DHCP</text><rect x="60" y="338" width="260" height="50" rx="6" fill="#ffffff" stroke="#666666" stroke-width="1.5"/><text x="190" y="352" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="12.5" fill="#555" text-anchor="middle" dominant-baseline="central" xml:space="preserve">after RELEASE</text><text x="190" y="369" font-family="DejaVu Sans Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="13" fill="#000" text-anchor="middle" dominant-baseline="central" xml:space="preserve" font-weight="bold">no IPv4 address</text><text x="190" y="383" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="11.5" fill="#777" text-anchor="middle" dominant-baseline="central" xml:space="preserve">the script removed both</text><rect x="860" y="70" width="300" height="330" rx="10" fill="#f5f5f5" stroke="#666666" stroke-width="2"/><text x="1010" y="95" font-family="DejaVu Sans Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="17" fill="#000" text-anchor="middle" dominant-baseline="central" xml:space="preserve" font-weight="bold">dhcp</text><text x="1010" y="120" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="14" fill="#000" text-anchor="middle" dominant-baseline="central" xml:space="preserve">the practice DHCP server</text><text x="1010" y="142" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="13" fill="#555" text-anchor="middle" dominant-baseline="central" xml:space="preserve" font-style="italic">ready-made: you only start it</text><rect x="880" y="165" width="260" height="36" rx="6" fill="#ffffff" stroke="#666666" stroke-width="1.5"/><text x="1010" y="183" font-family="DejaVu Sans Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="14" fill="#000" text-anchor="middle" dominant-baseline="central" xml:space="preserve" font-weight="bold">10.88.0.10</text><text x="1010" y="228" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="14" fill="#000" text-anchor="middle" dominant-baseline="central" xml:space="preserve">lends 10.88.0.200 - 10.88.0.209</text><text x="1010" y="252" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="14" fill="#000" text-anchor="middle" dominant-baseline="central" xml:space="preserve">for 10 minutes</text><text x="1010" y="276" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="14" fill="#000" text-anchor="middle" dominant-baseline="central" xml:space="preserve">with the gateway 10.88.0.1</text><rect x="880" y="320" width="260" height="56" rx="6" fill="#ffffff" stroke="#666666" stroke-width="1.5"/><text x="1010" y="338" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="12.5" fill="#555" text-anchor="middle" dominant-baseline="central" xml:space="preserve">its log, the same messages:</text><text x="1010" y="360" font-family="DejaVu Sans Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="13" fill="#000" text-anchor="middle" dominant-baseline="central" xml:space="preserve" font-weight="bold">sudo podman logs dhcp</text><line x1="345" y1="120" x2="841" y2="120" stroke="#d79b00" stroke-width="2.5"/><path d="M853,120 L839,113 L839,127 z" fill="#d79b00"/><text x="500" y="106" font-family="DejaVu Sans Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="14.5" fill="#000" text-anchor="end" dominant-baseline="central" xml:space="preserve" font-weight="bold">1. DISCOVER</text><text x="512" y="106" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="13.5" fill="#444" text-anchor="start" dominant-baseline="central" xml:space="preserve">is there a DHCP server? (to everybody)</text><line x1="855" y1="182" x2="359" y2="182" stroke="#d79b00" stroke-width="2.5"/><path d="M347,182 L361,175 L361,189 z" fill="#d79b00"/><text x="500" y="168" font-family="DejaVu Sans Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="14.5" fill="#000" text-anchor="end" dominant-baseline="central" xml:space="preserve" font-weight="bold">2. OFFER</text><text x="512" y="168" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="13.5" fill="#444" text-anchor="start" dominant-baseline="central" xml:space="preserve">you can have 10.88.0.204/16, for 10 minutes</text><line x1="345" y1="244" x2="841" y2="244" stroke="#d79b00" stroke-width="2.5"/><path d="M853,244 L839,237 L839,251 z" fill="#d79b00"/><text x="500" y="230" font-family="DejaVu Sans Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="14.5" fill="#000" text-anchor="end" dominant-baseline="central" xml:space="preserve" font-weight="bold">3. REQUEST</text><text x="512" y="230" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="13.5" fill="#444" text-anchor="start" dominant-baseline="central" xml:space="preserve">I take 10.88.0.204 (to everybody)</text><line x1="855" y1="306" x2="359" y2="306" stroke="#d79b00" stroke-width="2.5"/><path d="M347,306 L361,299 L361,313 z" fill="#d79b00"/><text x="500" y="292" font-family="DejaVu Sans Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="14.5" fill="#000" text-anchor="end" dominant-baseline="central" xml:space="preserve" font-weight="bold">4. ACK</text><text x="512" y="292" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="13.5" fill="#444" text-anchor="start" dominant-baseline="central" xml:space="preserve">it is yours</text><line x1="345" y1="368" x2="841" y2="368" stroke="#777777" stroke-width="2.5" stroke-dasharray="7,5"/><path d="M853,368 L839,361 L839,375 z" fill="#777777"/><text x="500" y="354" font-family="DejaVu Sans Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="14.5" fill="#000" text-anchor="end" dominant-baseline="central" xml:space="preserve" font-weight="bold">5. RELEASE</text><text x="512" y="354" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="13.5" fill="#444" text-anchor="start" dominant-baseline="central" xml:space="preserve">I give it back (dhclient -r)</text><rect x="40" y="420" width="1120" height="44" rx="8" fill="#ffe6cc" stroke="#d79b00" stroke-width="2"/><text x="600" y="442" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="14" fill="#000" text-anchor="middle" dominant-baseline="central" xml:space="preserve">podman0: the messages stay inside your computer, the network of the lab never sees them</text><line x1="190" y1="400" x2="190" y2="420" stroke="#666666" stroke-width="2"/><line x1="1010" y1="400" x2="1010" y2="420" stroke="#666666" stroke-width="2"/><line x1="40" y1="490" x2="340" y2="490" stroke="#666666" stroke-width="2"/><line x1="40" y1="482" x2="40" y2="490" stroke="#666666" stroke-width="2"/><line x1="340" y1="482" x2="340" y2="490" stroke="#666666" stroke-width="2"/><text x="190.0" y="518" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="22" fill="#000" text-anchor="middle" dominant-baseline="central" xml:space="preserve" font-weight="bold">the client: you</text><text x="190.0" y="546" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="13.5" fill="#555" text-anchor="middle" dominant-baseline="central" xml:space="preserve">you run dhclient and read</text><text x="190.0" y="566" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="13.5" fill="#555" text-anchor="middle" dominant-baseline="central" xml:space="preserve">the addresses of eth0</text><line x1="860" y1="490" x2="1160" y2="490" stroke="#666666" stroke-width="2"/><line x1="860" y1="482" x2="860" y2="490" stroke="#666666" stroke-width="2"/><line x1="1160" y1="482" x2="1160" y2="490" stroke="#666666" stroke-width="2"/><text x="1010.0" y="518" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="22" fill="#000" text-anchor="middle" dominant-baseline="central" xml:space="preserve" font-weight="bold">the practice server</text><text x="1010.0" y="546" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="13.5" fill="#555" text-anchor="middle" dominant-baseline="central" xml:space="preserve">started with the command of the lab,</text><text x="1010.0" y="566" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="13.5" fill="#555" text-anchor="middle" dominant-baseline="central" xml:space="preserve">never configured by you</text></svg>
