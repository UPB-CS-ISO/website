<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666666"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="600.0" y="30" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="22" fill="#444" text-anchor="middle" dominant-baseline="central" xml:space="preserve" font-style="italic">an image is a template that never changes; a container is a running copy of it</text><rect x="30" y="200" width="220" height="130" rx="10" fill="#ffffff" stroke="#666666" stroke-width="2"/><text x="140" y="225" font-family="DejaVu Sans Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="16" fill="#000" text-anchor="middle" dominant-baseline="central" xml:space="preserve" font-weight="bold">Containerfile</text><text x="140" y="260" font-family="DejaVu Sans Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="14" fill="#000" text-anchor="middle" dominant-baseline="central" xml:space="preserve">FROM debian</text><text x="140" y="284" font-family="DejaVu Sans Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="14" fill="#000" text-anchor="middle" dominant-baseline="central" xml:space="preserve">RUN apt-get install ...</text><line x1="250" y1="265" x2="352" y2="265" stroke="#666666" stroke-width="2" marker-end="url(#arr)"/><text x="301" y="248" font-family="DejaVu Sans Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="13" fill="#000" text-anchor="middle" dominant-baseline="central" xml:space="preserve" font-weight="bold">podman build</text><text x="301" y="284" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="13" fill="#555" text-anchor="middle" dominant-baseline="central" xml:space="preserve">once</text><rect x="360" y="150" width="250" height="230" rx="10" fill="#ffe6cc" stroke="#d79b00" stroke-width="2"/><text x="485" y="170" font-family="DejaVu Sans Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="16" fill="#000" text-anchor="middle" dominant-baseline="central" xml:space="preserve" font-weight="bold">lab09</text><rect x="380" y="190" width="210" height="60" rx="6" fill="#ffffff" stroke="#666666" stroke-width="1.5"/><text x="485" y="211" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="14" fill="#000" text-anchor="middle" dominant-baseline="central" xml:space="preserve" font-weight="bold">+ the tools of the lab</text><text x="485" y="233" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="13" fill="#555" text-anchor="middle" dominant-baseline="central" xml:space="preserve">(the RUN line)</text><rect x="380" y="260" width="210" height="60" rx="6" fill="#ffffff" stroke="#666666" stroke-width="1.5"/><text x="485" y="281" font-family="DejaVu Sans Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="14" fill="#000" text-anchor="middle" dominant-baseline="central" xml:space="preserve" font-weight="bold">debian:trixie-slim</text><text x="485" y="303" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="13" fill="#555" text-anchor="middle" dominant-baseline="central" xml:space="preserve">(the FROM line)</text><text x="485" y="350" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="13" fill="#000" text-anchor="middle" dominant-baseline="central" xml:space="preserve">read-only: nothing runs</text><line x1="610" y1="265" x2="712" y2="140" stroke="#666666" stroke-width="2" marker-end="url(#arr)"/><rect x="720" y="75" width="440" height="130" rx="10" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/><text x="940" y="89" font-family="DejaVu Sans Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="15" fill="#000" text-anchor="middle" dominant-baseline="central" xml:space="preserve" font-weight="bold">pc1</text><rect x="735" y="105" width="200" height="42" rx="6