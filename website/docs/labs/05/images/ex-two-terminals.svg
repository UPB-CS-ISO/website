<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="416" viewBox="0 0 1200 416"><defs></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="600.0" y="28" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="22" fill="#555555" font-style="italic" text-anchor="middle" dominant-baseline="central">two terminals: passwd waits in one, and you inspect it from the other</text><g transform="translate(0,56)"><rect x="20" y="20" width="560" height="320" rx="12" fill="#647687" stroke="#314354" stroke-width="2"/><text x="42" y="54" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="24" fill="#ffffff" text-anchor="start" dominant-baseline="central" xml:space="preserve" font-style="italic">the second terminal</text><text x="50" y="110" font-family="DejaVu Sans Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="24" fill="#000" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan fill="#c7f0c0" font-weight="bold">$ </tspan><tspan fill="#fff">passwd</tspan></text><text x="50" y="150" font-family="DejaVu Sans Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="19" fill="#fff" text-anchor="start" dominant-baseline="central" xml:space="preserve">Changing password for user student.</text><text x="50" y="185" font-family="DejaVu Sans Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="19" fill="#fff" text-anchor="start" dominant-baseline="central" xml:space="preserve">Current password: ▌</text><text x="50" y="260" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="19" fill="#dde" text-anchor="start" dominant-baseline="central" xml:space="preserve" font-style="italic">do not type anything: passwd waits</text><rect x="620" y="20" width="560" height="320" rx="12" fill="#647687" stroke="#314354" stroke-width="2"/><text x="642" y="54" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="24" fill="#ffffff" text-anchor="start" dominant-baseline="central" xml:space="preserve" font-style="italic">the first terminal</text><text x="650" y="110" font-family="DejaVu Sans Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="22" fill="#000" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan fill="#c7f0c0" font-weight="bold">$ </tspan><tspan fill="#fff">ps -o ??? -C passwd</tspan></text><text x="650" y="150" font-family="DejaVu Sans Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="19" fill="#fff" text-anchor="start" dominant-baseline="central" xml:space="preserve">    PID RUSER    EUSER    COMMAND</text><text x="650" y="185" font-family="DejaVu Sans Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="19" fill="#ffd9a8" text-anchor="start" dominant-baseline="central" xml:space="preserve">   6011 ???      ???      passwd</text><text x="650" y="230" font-family="DejaVu Sans Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="19" fill="#000" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan fill="#c7f0c0" font-weight="bold">$ </tspan><tspan fill="#fff">grep Uid /proc/6011/status</tspan></text><text x="650" y="265" font-family="DejaVu Sans Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="19" fill="#ffd9a8" text-anchor="start" dominant-baseline="central" xml:space="preserve">Uid:  ???  ???  ???  ???</text></g></svg>
