<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="656" viewBox="0 0 1200 656"><defs><marker id="a000" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker><marker id="a666666" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666666"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="600.0" y="28" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="22" fill="#555555" font-style="italic" text-anchor="middle" dominant-baseline="central">logging in on tty3: how a process gets the credentials of the user</text><g transform="translate(0,56)"><rect x="30" y="50" width="250" height="100" rx="14" fill="#f8cecc" stroke="#b85450" stroke-width="2"/><text x="155.0" y="85.0" font-family="DejaVu Sans Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="26" fill="#000" text-anchor="middle" dominant-baseline="central" xml:space="preserve" font-weight="bold">systemd</text><text x="155.0" y="118.0" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="20" fill="#000" text-anchor="middle" dominant-baseline="central" xml:space="preserve"><tspan fill="#000">👤 </tspan><tspan fill="#b85450" font-weight="bold">root</tspan><tspan fill="#333">  UID 0</tspan></text><rect x="400" y="50" width="250" height="100" rx="14" fill="#f8cecc" stroke="#b85450" stroke-width="2"/><text x="525.0" y="78.0" font-family="DejaVu Sans Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="26" fill="#000" text-anchor="middle" dominant-baseline="central" xml:space="preserve" font-weight="bold">agetty tty3</text><text x="525.0" y="110.0" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="20" fill="#000" text-anchor="middle" dominant-baseline="central" xml:space="preserve"><tspan fill="#000">👤 </tspan><tspan fill="#b85450" font-weight="bold">root</tspan><tspan fill="#333">  UID 0</tspan></text><text x="525.0" y="138.0" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="17" fill="#444" text-anchor="middle" dominant-baseline="central" xml:space="preserve" font-style="italic">prints login:</text><rect x="770" y="50" width="250" height="100" rx="14" fill="#f8cecc" stroke="#b85450" stroke-width="2"/><text x="895.0" y="78.0" font-family="DejaVu Sans Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="26" fill="#000" text-anchor="middle" dominant-baseline="central" xml:space="preserve" font-weight="bold">login</text><text x="895.0" y="110.0" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="20" fill="#000" text-anchor="middle" dominant-baseline="central" xml:space="preserve"><tspan fill="#000">👤 </tspan><tspan fill="#b85450" font-weight="bold">root</tspan><tspan fill="#333">  UID 0</tspan></text><text x="895.0" y="138.0" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="17" fill="#444" text-anchor="middle" dominant-baseline="central" xml:space="preserve" font-style="italic">asks for the password</text><path d="M280,100 L395,100" fill="none" stroke="#000" stroke-width="2.5" marker-end="url(#a000)"/><text x="338" y="80.0" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="18" fill="#000" text-anchor="middle" dominant-baseline="central" xml:space="preserve">1. starts</text><path d="M650,100 L765,100" fill="none" stroke="#000" stroke-width="2.5" marker-end="url(#a000)"/><text x="708" y="80.0" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="18" fill="#000" text-anchor="middle" dominant-baseline="central" xml:space="preserve">2. exec</text><rect x="1060" y="45" width="130" height="45" rx="6" fill="#ffffff" stroke="#666666" stroke-width="2"/><text x="1125.0" y="67.5" font-family="DejaVu Sans Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="16" fill="#000000" text-anchor="middle" dominant-baseline="central" xml:space="preserve">/etc/passwd</text><rect x="1060" y="110" width="130" height="45" rx="6" fill="#ffffff" stroke="#666666" stroke-width="2"/><text x="1125.0" y="132.5" font-family="DejaVu Sans Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="16" fill="#000000" text-anchor="middle" dominant-baseline="central" xml:space="preserve">/etc/shadow</text><path d="M1060,67 L1024,67" fill="none" stroke="#666666" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#a666666)"/><path d="M1060,132 L1024,132" fill="none" stroke="#666666" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#a666666)"/><text x="1115" y="180" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="18" fill="#666" text-anchor="middle" dominant-baseline="central" xml:space="preserve">3. reads, checks</text><path d="M895,150 L895,255" fill="none" stroke="#000" stroke-width="2.5" marker-end="url(#a000)"/><text x="915" y="200.0" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="18" fill="#000" text-anchor="start" dominant-baseline="central" xml:space="preserve">4. fork</text><rect x="745" y="260" width="300" height="120" rx="14" fill="#ffe6cc" stroke="#d79b00" stroke-width="2"/><text x="895" y="290" font-family="DejaVu Sans Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="24" fill="#000" text-anchor="middle" dominant-baseline="central" xml:space="preserve" font-weight="bold">login (child)</text><text x="895" y="325" font-family="DejaVu Sans Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="17" fill="#000" text-anchor="middle" dominant-baseline="central" xml:space="preserve">setgid(1000), initgroups()</text><text x="895" y="352" font-family="DejaVu Sans Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="17" fill="#000" text-anchor="middle" dominant-baseline="central" xml:space="preserve">setuid(1000)</text><path d="M895,380 L895,455" fill="none" stroke="#000" stroke-width="2.5" marker-end="url(#a000)"/><text x="915" y="418.0" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="18" fill="#000" text-anchor="start" dominant-baseline="central" xml:space="preserve">5. exec /bin/bash</text><rect x="770" y="460" width="250" height="100" rx="14" fill="#6d8764" stroke="#3a5431" stroke-width="2"/><text x="895.0" y="488.0" font-family="DejaVu Sans Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="26" fill="#000" text-anchor="middle" dominant-baseline="central" xml:space="preserve" font-weight="bold">bash</text><text x="895.0" y="520.0" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="20" fill="#000" text-anchor="middle" dominant-baseline="central" xml:space="preserve"><tspan fill="#000">👤 </tspan><tspan fill="#23445d" font-weight="bold">student</tspan><tspan fill="#333">  UID 1000</tspan></text><text x="895.0" y="548.0" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="17" fill="#444" text-anchor="middle" dominant-baseline="central" xml:space="preserve" font-style="italic">in /home/student</text><rect x="60" y="280" width="560" height="270" rx="10" fill="#ffffff" stroke="#666666" stroke-width="2" stroke-dasharray="10 6"/><text x="90" y="315" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="22" fill="#000" text-anchor="start" dominant-baseline="central" xml:space="preserve" font-weight="bold">what changes at login</text><rect x="90" y="341" width="34" height="28" rx="5" fill="#f8cecc" stroke="#b85450" stroke-width="2"/><text x="140" y="355" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="20" fill="#000" text-anchor="start" dominant-baseline="central" xml:space="preserve">runs as root: may read /etc/shadow</text><rect x="90" y="379" width="34" height="28" rx="5" fill="#ffe6cc" stroke="#d79b00" stroke-width="2"/><text x="140" y="393" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="20" fill="#000" text-anchor="start" dominant-baseline="central" xml:space="preserve">becomes the user: after setuid,</text><text x="140" y="431" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="20" fill="#000" text-anchor="start" dominant-baseline="central" xml:space="preserve">it can never go back to root</text><rect x="90" y="455" width="34" height="28" rx="5" fill="#6d8764" stroke="#3a5431" stroke-width="2"/><text x="140" y="469" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="20" fill="#000" text-anchor="start" dominant-baseline="central" xml:space="preserve">the shell of the user: every program</text><text x="140" y="507" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="20" fill="#000" text-anchor="start" dominant-baseline="central" xml:space="preserve">it starts inherits UID 1000</text></g></svg>
