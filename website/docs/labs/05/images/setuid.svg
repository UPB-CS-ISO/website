<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="370" viewBox="0 0 1200 370"><defs><marker id="ab85450" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b85450"/></marker><marker id="a000" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker><marker id="a3a7d2c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a7d2c"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="20" y="120" width="240" height="110" rx="14" fill="#bac8d3" stroke="#23445d" stroke-width="2"/><text x="140.0" y="160.0" font-family="DejaVu Sans Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="26" fill="#000" text-anchor="middle" dominant-baseline="central" xml:space="preserve" font-weight="bold">bash</text><text x="140.0" y="193.0" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="20" fill="#000" text-anchor="middle" dominant-baseline="central" xml:space="preserve"><tspan fill="#000">👤 </tspan><tspan fill="#23445d" font-weight="bold">student</tspan><tspan fill="#333">  UID 1000</tspan></text><rect x="330" y="120" width="250" height="110" rx="14" fill="#ffffff" stroke="#666666" stroke-width="2"/><text x="455" y="150" font-family="DejaVu Sans Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="21" fill="#000" text-anchor="middle" dominant-baseline="central" xml:space="preserve" font-weight="bold">/usr/bin/passwd</text><text x="455" y="185" font-family="DejaVu Sans Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="26" fill="#000" text-anchor="middle" dominant-baseline="central" xml:space="preserve"><tspan fill="#6c8ebf" font-weight="bold">rw</tspan><tspan fill="#b85450" font-weight="bold">s</tspan><tspan fill="#333">r-xr-x</tspan></text><text x="455" y="213" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="18" fill="#444" text-anchor="middle" dominant-baseline="central" xml:space="preserve">owner: root</text><rect x="650" y="110" width="260" height="130" rx="14" fill="#ffe6cc" stroke="#d79b00" stroke-width="2"/><text x="780" y="140" font-family="DejaVu Sans Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="26" fill="#000" text-anchor="middle" dominant-baseline="central" xml:space="preserve" font-weight="bold">passwd</text><text x="780" y="177" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="19" fill="#000" text-anchor="middle" dominant-baseline="central" xml:space="preserve"><tspan fill="#333">real UID: </tspan><tspan fill="#23445d" font-weight="bold">student</tspan></text><text x="780" y="207" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="19" fill="#000" text-anchor="middle" dominant-baseline="central" xml:space="preserve"><tspan fill="#333">effective UID: </tspan><tspan fill="#b85450" font-weight="bold">root</tspan></text><rect x="980" y="120" width="200" height="110" rx="14" fill="#ffffff" stroke="#666666" stroke-width="2"/><text x="1080.0" y="150.3" font-family="DejaVu Sans Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="19" fill="#000000" text-anchor="middle" dominant-baseline="central" xml:space="preserve">/etc/shadow</text><text x="1080.0" y="175.0" font-family="DejaVu Sans Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="19" fill="#000000" text-anchor="middle" dominant-baseline="central" xml:space="preserve">----------</text><text x="1080.0" y="199.7" font-family="DejaVu Sans Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="19" fill="#000000" text-anchor="middle" dominant-baseline="central" xml:space="preserve">root root</text><path d="M260,175 L325,175" fill="none" stroke="#000" stroke-width="2.5" marker-end="url(#a000)"/><text x="292" y="155.0" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="18" fill="#000" text-anchor="middle" dominant-baseline="central" xml:space="preserve">runs</text><path d="M580,175 L645,175" fill="none" stroke="#b85450" stroke-width="2.5" marker-end="url(#ab85450)"/><text x="612" y="155.0" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="18" fill="#b85450" text-anchor="middle" dominant-baseline="central" xml:space="preserve">s: as root</text><path d="M910,175 L975,175" fill="none" stroke="#3a7d2c" stroke-width="2.5" marker-end="url(#a3a7d2c)"/><text x="942" y="155.0" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="18" fill="#3a7d2c" text-anchor="middle" dominant-baseline="central" xml:space="preserve">writes</text><text x="600" y="40" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="21" fill="#444" text-anchor="middle" dominant-baseline="central" xml:space="preserve" font-style="italic">the s bit: the program runs as the owner of its file, not as the user who starts it</text><text x="600" y="300" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="20" fill="#333" text-anchor="middle" dominant-baseline="central" xml:space="preserve">the kernel checks the effective UID, root, so passwd may write /etc/shadow;</text><text x="600" y="330" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="20" fill="#333" text-anchor="middle" dominant-baseline="central" xml:space="preserve">passwd reads the real UID, student, to change only the password of student</text></svg>
