<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="616" viewBox="0 0 1200 616"><defs><marker id="a666666" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666666"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="600.0" y="28" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="22" fill="#555555" font-style="italic" text-anchor="middle" dominant-baseline="central">a directory is a list of names, and r, w and x are rights on this list</text><g transform="translate(0,56)"><rect x="40" y="30" width="440" height="330" rx="14" fill="#647687" stroke="#314354" stroke-width="2"/><text x="62" y="64" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="24" fill="#ffffff" text-anchor="start" dominant-baseline="central" xml:space="preserve" font-style="italic">📁 project: a list of names</text><rect x="80" y="90" width="360" height="60" rx="8" fill="#bac8d3" stroke="#23445d" stroke-width="2"/><text x="260.0" y="120.0" font-family="DejaVu Sans Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="24" fill="#000000" text-anchor="middle" dominant-baseline="central" xml:space="preserve">notes.txt</text><rect x="760" y="85" width="380" height="70" rx="8" fill="#ffffff" stroke="#666666" stroke-width="2"/><text x="950" y="105" font-family="DejaVu Sans Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="22" fill="#000" text-anchor="middle" dominant-baseline="central" xml:space="preserve">buy milk</text><text x="950" y="135" font-family="DejaVu Sans Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="17" fill="#666" text-anchor="middle" dominant-baseline="central" xml:space="preserve">-rw-r--r--</text><path d="M440,120 L755,120" fill="none" stroke="#666666" stroke-width="2.5" marker-end="url(#a666666)"/><rect x="80" y="175" width="360" height="60" rx="8" fill="#bac8d3" stroke="#23445d" stroke-width="2"/><text x="260.0" y="205.0" font-family="DejaVu Sans Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="24" fill="#000000" text-anchor="middle" dominant-baseline="central" xml:space="preserve">report.pdf</text><rect x="760" y="170" width="380" height="70" rx="8" fill="#ffffff" stroke="#666666" stroke-width="2"/><text x="950" y="190" font-family="DejaVu Sans Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="22" fill="#000" text-anchor="middle" dominant-baseline="central" xml:space="preserve">%PDF-1.7 …</text><text x="950" y="220" font-family="DejaVu Sans Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="17" fill="#666" text-anchor="middle" dominant-baseline="central" xml:space="preserve">-r--r--r--</text><path d="M440,205 L755,205" fill="none" stroke="#666666" stroke-width="2.5" marker-end="url(#a666666)"/><rect x="80" y="260" width="360" height="60" rx="8" fill="#bac8d3" stroke="#23445d" stroke-width="2"/><text x="260.0" y="290.0" font-family="DejaVu Sans Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="24" fill="#000000" text-anchor="middle" dominant-baseline="central" xml:space="preserve">todo.txt</text><rect x="760" y="255" width="380" height="70" rx="8" fill="#ffffff" stroke="#666666" stroke-width="2"/><text x="950" y="275" font-family="DejaVu Sans Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="22" fill="#000" text-anchor="middle" dominant-baseline="central" xml:space="preserve">call Bob</text><text x="950" y="305" font-family="DejaVu Sans Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="17" fill="#666" text-anchor="middle" dominant-baseline="central" xml:space="preserve">-rw-------</text><path d="M440,290 L755,290" fill="none" stroke="#666666" stroke-width="2.5" marker-end="url(#a666666)"/><text x="950" y="50" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="22" fill="#444" text-anchor="middle" dominant-baseline="central" xml:space="preserve" font-style="italic">📄 the files, kept apart</text><rect x="40" y="400" width="360" height="130" rx="10" fill="#fff2cc" stroke="#d6b656" stroke-width="2"/><text x="70" y="435" font-family="DejaVu Sans Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="34" fill="#7a5c00" text-anchor="middle" dominant-baseline="central" xml:space="preserve" font-weight="bold">r</text><text x="100" y="435" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="21" fill="#000" text-anchor="start" dominant-baseline="central" xml:space="preserve" font-weight="bold">reads the list</text><text x="220" y="485" font-family="DejaVu Sans Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="17" fill="#333" text-anchor="middle" dominant-baseline="central" xml:space="preserve">ls project</text><rect x="420" y="400" width="360" height="130" rx="10" fill="#fff2cc" stroke="#d6b656" stroke-width="2"/><text x="450" y="435" font-family="DejaVu Sans Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="34" fill="#7a5c00" text-anchor="middle" dominant-baseline="central" xml:space="preserve" font-weight="bold">w</text><text x="480" y="435" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="21" fill="#000" text-anchor="start" dominant-baseline="central" xml:space="preserve" font-weight="bold">changes the list</text><text x="600" y="485" font-family="DejaVu Sans Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="17" fill="#333" text-anchor="middle" dominant-baseline="central" xml:space="preserve">touch, rm, mv in project</text><rect x="800" y="400" width="360" height="130" rx="10" fill="#fff2cc" stroke="#d6b656" stroke-width="2"/><text x="830" y="435" font-family="DejaVu Sans Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="34" fill="#7a5c00" text-anchor="middle" dominant-baseline="central" xml:space="preserve" font-weight="bold">x</text><text x="860" y="435" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="21" fill="#000" text-anchor="start" dominant-baseline="central" xml:space="preserve" font-weight="bold">uses the list to reach a file</text><text x="980" y="485" font-family="DejaVu Sans Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="17" fill="#333" text-anchor="middle" dominant-baseline="central" xml:space="preserve">cd project, cat project/notes.txt</text></g></svg>
