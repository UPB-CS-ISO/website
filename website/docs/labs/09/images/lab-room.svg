<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470"><rect width="100%" height="100%" fill="#ffffff"/><text x="600" y="30" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="18" fill="#444" text-anchor="middle" dominant-baseline="central" xml:space="preserve" font-style="italic">the network of the lab: the switch joins the computers of the room, the router joins the room to the other networks</text><rect x="30" y="62" width="640" height="330" rx="14" fill="#ffffff" stroke="#999999" stroke-width="2" stroke-dasharray="8 6"/><text x="350" y="82" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="15" fill="#555" text-anchor="middle" dominant-baseline="central" xml:space="preserve" font-weight="bold">one local network: 10.41.1.0/24, the lab room</text><rect x="60" y="110" width="260" height="84" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/><text x="190" y="128" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="16" fill="#23445d" text-anchor="middle" dominant-baseline="central" xml:space="preserve" font-weight="bold">your computer</text><text x="190" y="152" font-family="DejaVu Sans Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="14" fill="#000" text-anchor="middle" dominant-baseline="central" xml:space="preserve">enp3s0 10.41.1.27</text><text x="190" y="173" font-family="DejaVu Sans Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="13" fill="#555" text-anchor="middle" dominant-baseline="central" xml:space="preserve">8c:16:45:a2:3b:91</text><line x1="320" y1="152" x2="440" y2="250" stroke="#666666" stroke-width="2"/><rect x="60" y="215" width="260" height="84" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/><text x="190" y="233" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="16" fill="#23445d" text-anchor="middle" dominant-baseline="central" xml:space="preserve" font-weight="bold">a colleague</text><text x="190" y="257" font-family="DejaVu Sans Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="14" fill="#000" text-anchor="middle" dominant-baseline="central" xml:space="preserve">10.41.1.28</text><text x="190" y="278" font-family="DejaVu Sans Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="13" fill="#555" text-anchor="middle" dominant-baseline="central" xml:space="preserve">8c:16:45:a2:3c:07</text><line x1="320" y1="257" x2="440" y2="250" stroke="#666666" stroke-width="2"/><rect x="60" y="320" width="260" height="44" rx="10" fill="#f5f5f5" stroke="#999999" stroke-width="2"/><text x="190" y="342" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="14" fill="#555" text-anchor="middle" dominant-baseline="central" xml:space="preserve">... the other computers of the room</text><line x1="320" y1="342" x2="440" y2="250" stroke="#666666" stroke-width="2"/><rect x="440" y="200" width="200" height="100" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/><text x="540" y="225" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="16" fill="#23445d" text-anchor="middle" dominant-baseline="central" xml:space="preserve" font-weight="bold">lab switch</text><text x="540" y="250" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="13" fill="#555" text-anchor="middle" dominant-baseline="central" xml:space="preserve">sends each frame</text><text x="540" y="270" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="13" fill="#555" text-anchor="middle" dominant-baseline="central" xml:space="preserve">only on the cable of its card</text><rect x="740" y="195" width="200" height="110" rx="10" fill="#ffe6cc" stroke="#d79b00" stroke-width="2"/><text x="840" y="218" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="16" fill="#000" text-anchor="middle" dominant-baseline="central" xml:space="preserve" font-weight="bold">lab gateway: a router</text><text x="840" y="243" font-family="DejaVu Sans Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="14" fill="#000" text-anchor="middle" dominant-baseline="central" xml:space="preserve">10.41.1.1</text><text x="840" y="265" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="13" fill="#555" text-anchor="middle" dominant-baseline="central" xml:space="preserve">NAT, public address</text><text x="840" y="285" font-family="DejaVu Sans Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="14" fill="#000" text-anchor="middle" dominant-baseline="central" xml:space="preserve">141.85.227.12</text><line x1="640" y1="250" x2="740" y2="250" stroke="#666666" stroke-width="2"/><rect x="1010" y="190" width="160" height="120" rx="10" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/><text x="1090" y="215" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="16" fill="#000" text-anchor="middle" dominant-baseline="central" xml:space="preserve" font-weight="bold">the Internet</text><text x="1090" y="240" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="13" fill="#555" text-anchor="middle" dominant-baseline="central" xml:space="preserve">other networks,</text><text x="1090" y="258" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="13" fill="#555" text-anchor="middle" dominant-baseline="central" xml:space="preserve">more routers</text><text x="1090" y="284" font-family="DejaVu Sans Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="14" fill="#000" text-anchor="middle" dominant-baseline="central" xml:space="preserve">8.8.8.8, upb.ro</text><line x1="940" y1="250" x2="1010" y2="250" stroke="#666666" stroke-width="2"/><text x="350" y="420" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="14" fill="#555" text-anchor="middle" dominant-baseline="central" xml:space="preserve">inside the room: the frames find the card by its MAC address (link layer)</text><text x="955" y="420" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="14" fill="#555" text-anchor="middle" dominant-baseline="central" xml:space="preserve">across networks: the packets find the computer</text><text x="955" y="440" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="14" fill="#555" text-anchor="middle" dominant-baseline="central" xml:space="preserve">by its IP address (network layer)</text><text x="600" y="50" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="13" fill="#555" text-anchor="middle" dominant-baseline="central" xml:space="preserve" font-style="italic">the addresses are examples: yours may differ (ip -br address)</text></svg>
