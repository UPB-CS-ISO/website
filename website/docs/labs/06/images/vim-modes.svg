<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620"><defs><marker id="a666666" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666666"/></marker><marker id="ad79b00" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d79b00"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="600.0" y="30" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="22" fill="#444" text-anchor="middle" dominant-baseline="central" xml:space="preserve" font-style="italic">the modes of vim: always look at the last line to know where you are</text><rect x="460" y="240" width="280" height="120" rx="14" fill="#ffe6cc" stroke="#d79b00" stroke-width="2"/><text x="600" y="272" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="26" fill="#d79b00" text-anchor="middle" dominant-baseline="central" xml:space="preserve" font-weight="bold">Normal</text><text x="600" y="306" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="18" fill="#555" text-anchor="middle" dominant-baseline="central" xml:space="preserve" font-style="italic">move, delete, copy, paste</text><text x="600" y="338" font-family="DejaVu Sans Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="17" fill="#333" text-anchor="middle" dominant-baseline="central" xml:space="preserve">(empty last line)</text><rect x="40" y="240" width="280" height="120" rx="14" fill="#ffffff" stroke="#666666" stroke-width="2"/><text x="180" y="272" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="26" fill="#000" text-anchor="middle" dominant-baseline="central" xml:space="preserve" font-weight="bold">Insert</text><text x="180" y="306" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="18" fill="#555" text-anchor="middle" dominant-baseline="central" xml:space="preserve" font-style="italic">type text</text><text x="180" y="338" font-family="DejaVu Sans Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="17" fill="#333" text-anchor="middle" dominant-baseline="central" xml:space="preserve">-- INSERT --</text><rect x="880" y="240" width="280" height="120" rx="14" fill="#ffffff" stroke="#666666" stroke-width="2"/><text x="1020" y="272" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="26" fill="#000" text-anchor="middle" dominant-baseline="central" xml:space="preserve" font-weight="bold">Command line</text><text x="1020" y="306" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="18" fill="#555" text-anchor="middle" dominant-baseline="central" xml:space="preserve" font-style="italic">save, quit, replace</text><text x="1020" y="338" font-family="DejaVu Sans Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="17" fill="#333" text-anchor="middle" dominant-baseline="central" xml:space="preserve">:wq  /text</text><rect x="460" y="470" width="280" height="120" rx="14" fill="#ffffff" stroke="#666666" stroke-width="2"/><text x="600" y="502" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="26" fill="#000" text-anchor="middle" dominant-baseline="central" xml:space="preserve" font-weight="bold">Visual</text><text x="600" y="536" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="18" fill="#555" text-anchor="middle" dominant-baseline="central" xml:space="preserve" font-style="italic">select text</text><text x="600" y="568" font-family="DejaVu Sans Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="17" fill="#333" text-anchor="middle" dominant-baseline="central" xml:space="preserve">-- VISUAL --</text><text x="600" y="200" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="17" fill="#d79b00" text-anchor="middle" dominant-baseline="central" xml:space="preserve" font-style="italic">vim starts here</text><path d="M600,210 L600,235" fill="none" stroke="#d79b00" stroke-width="2.5" marker-end="url(#ad79b00)"/><path d="M455,275 L325,275" fill="none" stroke="#666666" stroke-width="2.5" marker-end="url(#a666666)"/><text x="390" y="255" font-family="DejaVu Sans Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="18" fill="#000" text-anchor="middle" dominant-baseline="central" xml:space="preserve" font-weight="bold">i  a  o</text><path d="M325,325 L455,325" fill="none" stroke="#666666" stroke-width="2.5" marker-end="url(#a666666)"/><text x="390" y="345" font-family="DejaVu Sans Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="18" fill="#000" text-anchor="middle" dominant-baseline="central" xml:space="preserve" font-weight="bold">Esc</text><path d="M745,275 L875,275" fill="none" stroke="#666666" stroke-width="2.5" marker-end="url(#a666666)"/><text x="810" y="255" font-family="DejaVu Sans Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="18" fill="#000" text-anchor="middle" dominant-baseline="central" xml:space="preserve" font-weight="bold">:  /</text><path d="M875,325 L745,325" fill="none" stroke="#666666" stroke-width="2.5" marker-end="url(#a666666)"/><text x="810" y="345" font-family="DejaVu Sans Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="17" fill="#000" text-anchor="middle" dominant-baseline="central" xml:space="preserve" font-weight="bold">Enter, Esc</text><path d="M570,365 L570,465" fill="none" stroke="#666666" stroke-width="2.5" marker-end="url(#a666666)"/><text x="540" y="415" font-family="DejaVu Sans Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="18" fill="#000" text-anchor="end" dominant-baseline="central" xml:space="preserve" font-weight="bold">v  V</text><path d="M630,465 L630,365" fill="none" stroke="#666666" stroke-width="2.5" marker-end="url(#a666666)"/><text x="660" y="415" font-family="DejaVu Sans Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="18" fill="#000" text-anchor="start" dominant-baseline="central" xml:space="preserve" font-weight="bold">Esc</text><text x="600" y="100" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="19" fill="#333" text-anchor="middle" dominant-baseline="central" xml:space="preserve">lost? press Esc a few times: you are back in Normal mode</text><text x="600" y="135" font-family="DejaVu Sans Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="19" fill="#333" text-anchor="middle" dominant-baseline="central" xml:space="preserve">:q! quits without saving</text></svg>
