<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470"><defs><marker id="a666666" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666666"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="600" y="30" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="22" fill="#444" text-anchor="middle" dominant-baseline="central" xml:space="preserve" font-style="italic">every .c file is compiled alone, to its own object file; the linker joins the object files</text><rect x="85.0" y="60" width="230" height="74" rx="10" fill="#ffffff" stroke="#666666" stroke-width="2"/><text x="200" y="86" font-family="DejaVu Sans Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="19" fill="#000" text-anchor="middle" dominant-baseline="central" xml:space="preserve" font-weight="bold">main.c</text><text x="200" y="112" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="15" fill="#555" text-anchor="middle" dominant-baseline="central" xml:space="preserve" font-style="italic">includes lib.h, print.h</text><line x1="200" y1="140" x2="200" y2="186" stroke="#666666" stroke-width="2" marker-end="url(#a666666)"/><text x="212" y="163" font-family="DejaVu Sans Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="14" fill="#6c8ebf" text-anchor="start" dominant-baseline="central" xml:space="preserve">gcc -c main.c</text><rect x="85" y="190" width="230" height="110" rx="10" fill="#ffffff" stroke="#666666" stroke-width="2"/><text x="200" y="212" font-family="DejaVu Sans Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="19" fill="#000" text-anchor="middle" dominant-baseline="central" xml:space="preserve" font-weight="bold">main.o</text><text x="200" y="240" font-family="DejaVu Sans Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="14" fill="#333" text-anchor="middle" dominant-baseline="central" xml:space="preserve">T main</text><text x="200" y="260" font-family="DejaVu Sans Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="14" fill="#333" text-anchor="middle" dominant-baseline="central" xml:space="preserve">U sum</text><text x="200" y="280" font-family="DejaVu Sans Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="14" fill="#333" text-anchor="middle" dominant-baseline="central" xml:space="preserve">U print_result</text><line x1="200" y1="302" x2="460" y2="378" stroke="#666666" stroke-width="2" marker-end="url(#a666666)"/><rect x="385.0" y="60" width="230" height="74" rx="10" fill="#ffffff" stroke="#666666" stroke-width="2"/><text x="500" y="86" font-family="DejaVu Sans Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="19" fill="#000" text-anchor="middle" dominant-baseline="central" xml:space="preserve" font-weight="bold">lib.c</text><text x="500" y="112" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="15" fill="#555" text-anchor="middle" dominant-baseline="central" xml:space="preserve" font-style="italic">includes lib.h</text><line x1="500" y1="140" x2="500" y2="186" stroke="#666666" stroke-width="2" marker-end="url(#a666666)"/><text x="512" y="163" font-family="DejaVu Sans Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="14" fill="#6c8ebf" text-anchor="start" dominant-baseline="central" xml:space="preserve">gcc -c lib.c</text><rect x="385" y="190" width="230" height="110" rx="10" fill="#ffffff" stroke="#666666" stroke-width="2"/><text x="500" y="212" font-family="DejaVu Sans Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="19" fill="#000" text-anchor="middle" dominant-baseline="central" xml:space="preserve" font-weight="bold">lib.o</text><text x="500" y="240" font-family="DejaVu Sans Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="14" fill="#333" text-anchor="middle" dominant-baseline="central" xml:space="preserve">T sum</text><line x1="500" y1="302" x2="500" y2="378" stroke="#666666" stroke-width="2" marker-end="url(#a666666)"/><rect x="685.0" y="60" width="230" height="74" rx="10" fill="#ffffff" stroke="#666666" stroke-width="2"/><text x="800" y="86" font-family="DejaVu Sans Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="19" fill="#000" text-anchor="middle" dominant-baseline="central" xml:space="preserve" font-weight="bold">print.c</text><text x="800" y="112" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="15" fill="#555" text-anchor="middle" dominant-baseline="central" xml:space="preserve" font-style="italic">includes stdio.h, print.h</text><line x1="800" y1="140" x2="800" y2="186" stroke="#666666" stroke-width="2" marker-end="url(#a666666)"/><text x="812" y="163" font-family="DejaVu Sans Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="14" fill="#6c8ebf" text-anchor="start" dominant-baseline="central" xml:space="preserve">gcc -c print.c</text><rect x="685" y="190" width="230" height="110" rx="10" fill="#ffffff" stroke="#666666" stroke-width="2"/><text x="800" y="212" font-family="DejaVu Sans Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="19" fill="#000" text-anchor="middle" dominant-baseline="central" xml:space="preserve" font-weight="bold">print.o</text><text x="800" y="240" font-family="DejaVu Sans Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="14" fill="#333" text-anchor="middle" dominant-baseline="central" xml:space="preserve">T print_result</text><text x="800" y="260" font-family="DejaVu Sans Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="14" fill="#333" text-anchor="middle" dominant-baseline="central" xml:space="preserve">U printf</text><line x1="800" y1="302" x2="540" y2="378" stroke="#666666" stroke-width="2" marker-end="url(#a666666)"/><rect x="395" y="380" width="210" height="62" rx="10" fill="#ffe6cc" stroke="#d79b00" stroke-width="2"/><text x="500" y="400" font-family="DejaVu Sans Mono, Menlo, Consolas, 