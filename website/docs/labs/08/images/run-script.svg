" y2="552" stroke="#6c8ebf" stroke-width="2"/><path d="M939,546 L949,552 L939,558 z" fill="#6c8ebf"/><text x="594" y="536" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="14" fill="#555" text-anchor="middle" dominant-baseline="central" xml:space="preserve" font-style="italic">no kernel, no new bash:</text><text x="594" y="582" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="14" fill="#555" text-anchor="middle" dominant-baseline="central" xml:space="preserve" font-style="italic">backup.sh needs only r; its changes stay in your shell</text><text x="600" y="642" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="15" fill="#555" text-anchor="middle" dominant-baseline="central" xml:space="preserve" font-style="italic">orange: what ./backup.sh needs and the others do not: the x permission of the script and the shebang</text></svg>