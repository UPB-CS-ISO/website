name: Test deployment

on:
  pull_request:
    # Review gh actions docs if you want to further define triggers, paths, etc
    # https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#on
  merge_group:

jobs:
  test-deploy:
    name: Test deployment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: |
            website/package-lock.json
            slides/package-lock.json

      - name: Install Typst
        uses: typst-community/setup-typst@v4
        # with:
        #   typst-version: '0.13.1'   # optional: pin for reproducible builds

      - name: Install dependencies (slides)
        working-directory: slides
        run: |
          cargo install --git https://github.com/polylux-typ/polylux/ --branch release

      - name: Build slides
        working-directory: slides
        run: |
          make
          mkdir -p ../website/static/slides/
          cp build/*.pdf ../website/static/slides/

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies (interactive)
        working-directory: interactive
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          pip install -r requirements.txt

      - name: Build interactive lectures
        working-directory: interactive
        run: make

      - name: Install dependencies (website)
        working-directory: website
        run: npm ci

      - name: Test build website
        working-directory: website
        run: npm run build
