<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660"><rect width="100%" height="100%" fill="#ffffff"/><text x="600" y="30" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="18" fill="#444" text-anchor="middle" dominant-baseline="central" xml:space="preserve" font-style="italic">exercise 10: the container web waits on port 8080; your computer and pc1 ask it for a page</text><rect x="30" y="70" width="870" height="540" rx="14" fill="#ffffff" stroke="#666666" stroke-width="2"/><rect x="50" y="95" width="830" height="55" rx="8" fill="#f5f5f5" stroke="#999999" stroke-width="1.5"/><text x="64" y="113" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="14" fill="#000" text-anchor="start" dominant-baseline="central" xml:space="preserve" font-weight="bold">terminal 1: your computer</text><text x="64" y="135" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="13" fill="#555" text-anchor="start" dominant-baseline="central" xml:space="preserve">step 1: the ports of your computer; step 2: start web, and run ss inside web; step 3: curl from your computer</text><rect x="50" y="160" width="830" height="55" rx="8" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/><text x="64" y="178" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="14" fill="#000" text-anchor="start" dominant-baseline="central" xml:space="preserve" font-weight="bold">terminal 2: a shell in the container pc1</text><text x="64" y="200" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="13" fill="#555" text-anchor="start" dominant-baseline="central" xml:space="preserve">step 3: the same curl, from pc1</text><text x="50" y="231" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="12" fill="#777" text-anchor="start" dominant-baseline="central" xml:space="preserve" font-style="italic">a terminal of the same color as a container is a shell inside that container</tex