nt-size="12" fill="#777" text-anchor="middle" dominant-baseline="central" xml:space="preserve">veth2</text><rect x="70" y="405" width="240" height="78" rx="10" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/><text x="190" y="423" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="16" fill="#000" text-anchor="middle" dominant-baseline="central" xml:space="preserve" font-weight="bold">client</text><text x="190" y="446" font-family="DejaVu Sans Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="14" fill="#000" text-anchor="middle" dominant-baseline="central" xml:space="preserve">eth0 10.88.0.12/16</text><text x="190" y="467" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="13" fill="#555" text-anchor="middle" dominant-baseline="central" xml:space="preserve">+ an address from DHCP</text><line x1="310" y1="444" x2="380" y2="444" stroke="#666666" stroke-width="2"/><text x="345" y="431" font-family="DejaVu Sans Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="12" fill="#777" text-anchor="middle" dominant-baseline="central" xml:space="preserve">veth3</text><rect x="380" y="105" width="150" height="378" rx="10" fill="#ffe6cc" stroke="#d79b00" stroke-width="2"/><text x="455" y="250" font-family="DejaVu Sans Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="17" fill="#000" text-anchor="middle" dominant-baseline="central" xml:space="preserve" font-weight="bold">podman0</text><text x="455" y="276" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="14" fill="#000" text-anchor="middle" dominant-baseline="central" xml:space="preserve">virtual switch, and</text><text x="455" y="306" font-family="DejaVu Sans Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="14" fill="#000" text-anchor="middle" dominant-baseline="central" xml:space="preserve" font-weight="bold">10.88.0.1/16</text><text x="455" y="330" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="13" fill="#555" text-anchor="middle" dominant-baseline="central" xml:space="preserve">the card of your</text><text x="455" y="348" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="13" fill="#555" text-anchor="middle" dominant-baseline="central" xml:space="preserve">computer on it</text><line x1="530" y1="294" x2="575" y2="294" stroke="#666666" stroke-width="2"/><rect x="575" y="230" width="170" height="128" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/><text x="660" y="254" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="16" fill="#23445d" text-anchor="middle" dominant-baseline="central" xml:space="preserve" font-weight="bold">the kernel</text><text x="660" y="280" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="14" fill="#000" text-anchor="middle" dominant-baseline="central" xml:space="preserve">routing table</text><text x="660" y="304" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="14" fill="#000" text-anchor="middle" dominant-baseline="central" xml:space="preserve">NAT: 10.88.0.x</text><text x="660" y="326" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="14" fill="#000" text-anchor="middle" dominant-baseline="central" xml:space="preserve">becomes 10.41.1.27</text><line x1="660" y1="358" x2="660" y2="410" stroke="#666666" stroke-width="2"/><rect x="575" y="410" width="170" height="73" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/><text x="660" y="433" font-family="DejaVu Sans Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="16" fill="#23445d" text-anchor="middle" dominant-baseline="central" xml:space="preserve" font-weight="bold">enp3s0</text><text x="660" y="459" font-family="DejaVu Sans Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="14" fill="#000" text-anchor="middle" dominant-baseline="central" xml:space="preserve">10.41.1.27/24</text><text x="405" y="512" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="14" fill="#555" text-anchor="middle" dominant-baseline="central" xml:space="preserve" font-style="italic">network 10.88.0.0/16, inside the computer</text><line x1="745" y1="446" x2="840" y2="446" stroke="#666666" stroke-width="3"/><rect x="840" y="410" width="160" height="73" rx="10" fill="#ffffff" stroke="#666666" stroke-width="2"/><text x="920" y="433" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="16" fill="#000" text-anchor="middle" dominant-baseline="central" xml:space="preserve" font-weight="bold">lab switch</text><text x="920" y="459" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="13" fill="#555" text-anchor="middle" dominant-baseline="central" xml:space="preserve">frames, by MAC</text><line x1="1000" y1="446" x2="1035" y2="446" stroke="#666666" stroke-width="3"/><rect x="1035" y="410" width="135" height="73" rx="10" fill="#ffffff" stroke="#666666" stroke-width="2"/><text x="1102" y="433" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="16" fill="#000" text-anchor="middle" dominant-baseline="central" xml:space="preserve" font-weight="bold">colleague</text><text x="1102" y="459" font-family="DejaVu Sans Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="14" fill="#000" text-anchor="middle" dominant-baseline="central" xml:space="preserve">10.41.1.28</text><line x1="920" y1="410" x2="920" y2="345" stroke="#666666" stroke-width="3"/><rect x="840" y="260" width="160" height="85" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/><text x="920" y="282" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="16" fill="#23445d" text-anchor="middle" dominant-baseline="central" xml:space="preserve" font-weight="bold">lab gateway</text><text x="920" y="307" font-family="DejaVu Sans Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="14" fill="#000" text-anchor="middle" dominant-baseline="central" xml:space="preserve">10.41.1.1</text><text x="920" y="329" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="13" fill="#555" text-anchor="middle" dominant-baseline="central" xml:space="preserve">router, NAT</text><line x1="920" y1="260" x2="920" y2="185" stroke="#666666" stroke-width="3"/><rect x="840" y="105" width="330" height="80" rx="30" fill="#f5f5f5" stroke="#666666" stroke-width="2"/><text x="1005" y="132" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="16" fill="#000" text-anchor="middle" dominant-baseline="central" xml:space="preserve" font-weight="bold">the Internet</text><text x="1005" y="160" font-family="DejaVu Sans Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="14" fill="#000" text-anchor="middle" dominant-baseline="central" xml:space="preserve">8.8.8.8, upb.ro, ifconfig.me</text><text x="1005" y="512" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="14" fill="#555" text-anchor="middle" dominant-baseline="central" xml:space="preserve" font-style="italic">network 10.41.1.0/24, the lab</text><text x="1005" y="220" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="13" fill="#555" text-anchor="middle" dominant-baseline="central" xml:space="preserve">the address that the Internet sees:</text><text x="1005" y="240" font-family="DejaVu Sans Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="13" fill="#555" text-anchor="middle" dominant-baseline="central" xml:space="preserve">141.85.227.12</text><text x="600" y="570" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="14" fill="#777" text-anchor="middle" dominant-baseline="central" xml:space="preserve">the addresses are the ones of the examples: read yours with ip -br address</text></svg>
