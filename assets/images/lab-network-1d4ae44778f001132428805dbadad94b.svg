<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666666"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="600.0" y="30" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="22" fill="#444" text-anchor="middle" dominant-baseline="central" xml:space="preserve" font-style="italic">the network of the lab: your computer is the switch, the router and the NAT of its containers</text><rect x="40" y="70" width="730" height="470" rx="14" fill="#ffffff" stroke="#666666" stroke-width="2"/><rect x="330.0" y="58" width="150" height="24" rx="6" fill="#f5f5f5" stroke="#666666" stroke-width="1.5"/><text x="405" y="70" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="14" fill="#000" text-anchor="middle" dominant-baseline="central" xml:space="preserve" font-weight="bold">your computer</text><rect x="70" y="105" width="240" height="78" rx="10" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/><text x="190" y="123" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="16" fill="#000" text-anchor="middle" dominant-baseline="central" xml:space="preserve" font-weight="bold">pc1</text><text x="190" y="146" font-family="DejaVu Sans Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="14" fill="#000" text-anchor="middle" dominant-baseline="central" xml:space="preserve">eth0 10.88.0.11/16</text><text x="190" y="167" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="13" fill="#555" text-anchor="middle" dominant-baseline="central" xml:space="preserve">sleep infinity</text><line x1="310" y1="144" x2="380" y2="144" stroke="#666666" stroke-width="2"/><text x="345" y="131" font-family="DejaVu Sans Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="12" fill="#777" text-anchor="middle"