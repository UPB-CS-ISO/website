<svg xmlns="http://www.w3.org/2000/svg" viewBox="4 -3 120 94" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- a USB 4G / 5G modem, drawn in the style of the network cards of the USO book -->
  <g fill="none" stroke="#eb6a38" stroke-width="3.76" stroke-linejoin="round" stroke-linecap="round">
    <!-- the radio waves -->
    <path d="M 66 30 A 10 10 0 0 1 86 30" />
    <path d="M 59 28 A 17 17 0 0 1 93 28" />
    <path d="M 52 26 A 24 24 0 0 1 100 26" />
    <!-- the body of the modem -->
    <rect x="34" y="44" width="84" height="40" rx="9" ry="9" />
    <!-- the USB plug -->
    <rect x="10" y="53" width="24" height="22" rx="2" ry="2" />
    <line x1="34" y1="49" x2="34" y2="79" />
  </g>
  <g fill="#eb6a38">
    <!-- the holes of the USB plug -->
    <rect x="16" y="59" width="5" height="4" />
    <rect x="24" y="59" width="5" height="4" />
    <!-- the signal bars -->
    <rect x="84" y="70" width="5" height="6" rx="1" />
    <rect x="92" y="65" width="5" height="11" rx="1" />
    <rect x="100" y="59" width="5" height="17" rx="1" />
    <rect x="108" y="53" width="5" height="23" rx="1" transform="translate(-0.5 0)" />
    <!-- the LED -->
    <circle cx="76" cy="38" r="0" />
    <text x="44" y="71" font-family="DejaVu Sans, Helvetica, sans-serif" font-weight="bold" font-size="17">4G</text>
  </g>
</svg>
